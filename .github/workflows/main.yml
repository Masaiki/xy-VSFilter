name: C/C++ CI

on: [push]

jobs:
  build-win:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
    strategy:
      matrix:
        include:
        - platform: 'Win32'
          vcpkg_triplet: 'x86-windows-static'
        - platform: 'x64'
          vcpkg_triplet: 'x64-windows-static'
        - platform: 'ARM64EC'
          vcpkg_triplet: 'arm64ec-windows'
    steps:
      - uses: actions/checkout@v4
      - name: Install VS2010 Redistributable (for vsyasm)
        run: choco install vcredist2010 -y
      - name: install yasm
        shell: cmd
        run: |
          git clone https://github.com/ShiftMediaProject/VSYASM.git
          .\VSYASM\install_script.bat
      - name: install libass
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install libass:${{ matrix.vcpkg_triplet }}'
      - name: add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: build
        run: MSBuild.exe VSFilter.sln /t:xy_sub_filter:Rebuild /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 /m /p:Configuration=Release /p:Platform=${{matrix.platform}}
      - name: copy
        run: |
          New-Item -ItemType Directory -Force -Path dist\${{matrix.platform}}
          Copy-Item bin\lib_17.0\${{matrix.platform}}\Release\*.dll dist\${{matrix.platform}}\
          Copy-Item scripts\Install_XySubFilter.bat dist\${{matrix.platform}}\Install_XySubFilter.bat
          Copy-Item scripts\Uninstall_XySubFilter.bat dist\${{matrix.platform}}\Uninstall_XySubFilter.bat
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: xysubfilter_with_libass-${{ matrix.platform }}
          path: dist
