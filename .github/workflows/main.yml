name: C/C++ CI

on: [push]

jobs:
  build-win:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
    strategy:
      matrix:
        include:
        - platform: 'Win32'
          vcpkg_triplet: 'x86-windows-static'
        - platform: 'x64'
          vcpkg_triplet: 'x64-windows-static'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install VS2010 Redistributable (for vsyasm)
        run: choco install vcredist2010 -y
      - name: install yasm
        shell: cmd
        run: |
          git clone https://github.com/ShiftMediaProject/VSYASM.git
          .\VSYASM\install_script.bat
      - name: install vcpkg dependencies
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            libass:${{ matrix.vcpkg_triplet }} `
            boost-flyweight:${{ matrix.vcpkg_triplet }} `
            boost-smart-ptr:${{ matrix.vcpkg_triplet }} `
            "log4cplus[unicode]:${{ matrix.vcpkg_triplet }}"
      - name: add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: build xy_sub_filter
        run: MSBuild.exe VSFilter.sln /t:xy_sub_filter:Rebuild /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 /m /p:Configuration=Release /p:Platform=${{matrix.platform}}
      - name: build vsfilter
        run: MSBuild.exe VSFilter.sln /t:vsfilter:Rebuild /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 /m /p:Configuration=Release /p:Platform=${{matrix.platform}}
      - name: copy
        run: |
          New-Item -ItemType Directory -Force -Path dist\${{matrix.platform}}
          Copy-Item bin\lib_17.0\${{matrix.platform}}\Release\*.dll dist\${{matrix.platform}}\
          Copy-Item scripts\Install_XySubFilter.bat dist\${{matrix.platform}}\Install_XySubFilter.bat
          Copy-Item scripts\Uninstall_XySubFilter.bat dist\${{matrix.platform}}\Uninstall_XySubFilter.bat
          Copy-Item scripts\Install_VSFilter.bat dist\${{matrix.platform}}\Install_VSFilter.bat
          Copy-Item scripts\Uninstall_VSFilter.bat dist\${{matrix.platform}}\Uninstall_VSFilter.bat
      - name: resolve artifact name
        id: artifact
        shell: pwsh
        run: |
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $suffix = $suffix -replace '[\\/:*?"<>|]', '-'
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: vsfilter_xysubfilter_with_libass-${{ steps.artifact.outputs.suffix }}-${{ matrix.platform }}
          path: dist
